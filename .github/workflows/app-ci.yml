name: App CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://local:local@127.0.0.1:5432/avo_ci
  BETTER_AUTH_SECRET: synthetic-ci-secret-only-never-use-in-production-123456789
  BETTER_AUTH_URL: http://127.0.0.1:3200
  NEXT_PUBLIC_SITE_URL: https://avo.example.test
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Types, lint, format, tests, migrations, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin approved npm (lifecycle scripts disabled)
        run: npm install --global npm@11.11.0 --ignore-scripts --no-audit --no-fund
      - name: Check dependency policy before install
        run: npm run check:dependencies
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Confirm the authoritative lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Audit locked dependencies (high/critical gate)
        run: npm audit --package-lock-only --audit-level=high
      - name: Test dependency policy
        run: npm run test:dependencies
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Check task board
        run: npm run check:tasks
      - name: Test task-board guard
        run: npm run test:tasks
      - name: Check migration journal
        run: npm run db:check
      - name: Build production app with synthetic credentials
        run: npm run build

  e2e:
    name: Public browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin approved npm (lifecycle scripts disabled)
        run: npm install --global npm@11.11.0 --ignore-scripts --no-audit --no-fund
      - name: Check dependency policy before install
        run: npm run check:dependencies
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Confirm the authoritative lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production app with synthetic credentials
        run: npm run build
      - name: Run public browser journeys
        run: npm run test:e2e
