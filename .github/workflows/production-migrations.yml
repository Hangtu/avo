name: Production database migrations

on:
  pull_request:
    paths:
      - "drizzle/*.sql"
      - "drizzle/meta/**"
      - "drizzle.config.ts"
      - "drizzle.migrate.config.ts"
      - "drizzle.prod.config.ts"
      - "lib/db/migration-url*"
      - "lib/db/schema.ts"
      - "lib/db/auth-schema.ts"
      - "lib/db/account-migration.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "scripts/check-dependencies*"
      - ".github/workflows/production-migrations.yml"
  push:
    branches:
      - main
    paths:
      - "drizzle/*.sql"

permissions:
  contents: read

jobs:
  verify:
    name: Verify migration and application
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://local:local@127.0.0.1:5432/avo_ci
      BETTER_AUTH_SECRET: synthetic-ci-secret-only-never-use-in-production-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin approved npm (lifecycle scripts disabled)
        run: npm install --global npm@11.11.0 --ignore-scripts --no-audit --no-fund
      - name: Check dependency policy before install
        run: npm run check:dependencies
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Confirm the authoritative lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Audit locked dependencies (high/critical gate)
        run: npm audit --package-lock-only --audit-level=high
      - name: Test dependency policy
        run: npm run test:dependencies
      - name: Run tests
        run: npm test
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check migration journal
        run: npm run db:check
      - name: Build production app with synthetic credentials
        run: npm run build

  migrate-production:
    name: Apply pending production migrations
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_MIGRATIONS == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: production-migrations
    concurrency:
      group: avo-production-database-migrations
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin approved npm (lifecycle scripts disabled)
        run: npm install --global npm@11.11.0 --ignore-scripts --no-audit --no-fund
      - name: Check dependency policy before install
        run: npm run check:dependencies
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Confirm the authoritative lockfile is unchanged
        run: git diff --exit-code -- package-lock.json
      - name: Audit locked dependencies before exposing the migration credential
        run: npm audit --package-lock-only --audit-level=high
      - name: Confirm migration credential is configured
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.NEON_PRODUCTION_MIGRATION_URL }}
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL_UNPOOLED" ]]; then
            echo "Missing the NEON_PRODUCTION_MIGRATION_URL secret in the production-migrations environment." >&2
            exit 1
          fi
      - name: Apply reviewed pending migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.NEON_PRODUCTION_MIGRATION_URL }}
        run: npm run db:migrate
